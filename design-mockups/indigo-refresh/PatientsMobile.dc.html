<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
:root {
  --primary: #4F46E5;
  --primary-light: #E0E7FF;
  --primary-soft: #C7D2FE;
  --primary-tint: #EEF2FF;
  --app-bg: #FFFFFF;
  --surface: #FFFFFF;
  --slate-50: #F3F4FA;
  --slate-100: #E7E9F5;
  --slate-600: #525477;
  --text-primary: #1F2035;
  --text-secondary: #525477;
  --text-muted: #808298;
  --border: rgba(69, 61, 92, 0.12);
  --border-light: #E7E9F5;
  --overdue-bg: #F5DCE5;
  --overdue-text: #6B2038;
  --received-bg: #F3F4FA;
  --received-text: #1F2035;
  --patient-plum-bg: #F0DCEF;
  --patient-plum-fg: #75397A;
  --patient-terracotta-bg: #F7E0D2;
  --patient-terracotta-fg: #9A5023;
  --shadow-navbar: 0 2px 10px rgba(45, 48, 92, 0.05);
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; border: none; background: none; padding: 0; margin: 0; cursor: pointer; appearance: none; -webkit-appearance: none; text-align: inherit; }
body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; background: var(--app-bg); color: var(--text-primary); }
.screen { width: 390px; min-height: 1700px; background: var(--app-bg); display: flex; flex-direction: column; }
.workspace-header { height: 72px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; background: var(--surface); padding: 0 20px; box-shadow: var(--shadow-navbar); }
.workspace-header__icon-btn { width: 36px; height: 36px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); position: relative; }
.workspace-header__notif-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--overdue-text); border: 1.5px solid var(--surface); }
.workspace-header__right { display: flex; align-items: center; gap: 8px; }
.workspace-header__avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
.workspace-main { flex: 1; padding: 24px 20px 40px; }
.page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.patients-title { font-size: 19px; font-weight: 700; color: var(--text-primary); margin: 0; }
.patients-dropdown { height: 34px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 500; color: var(--text-primary); display: inline-flex; align-items: center; gap: 6px; }
.page-actions-row { display: flex; gap: 8px; margin-bottom: 20px; }
.header-soft-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--primary-soft); color: var(--primary); }
.patient-cards { display: flex; flex-direction: column; gap: 10px; }
.patient-card-m { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 16px; border: 1px solid var(--border-light); }
.patient-card-m--intake { background: var(--primary-light); border: 1px dashed #A5B4FC; }
.patient-card-m__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.patient-identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
.patient-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.patient-avatar--intake { background: var(--overdue-bg); color: var(--overdue-text); }
.patient-avatar--plum { background: var(--patient-plum-bg); color: var(--patient-plum-fg); }
.patient-avatar--terracotta { background: var(--patient-terracotta-bg); color: var(--patient-terracotta-fg); }
.patient-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
.patient-meta-row { display: flex; align-items: center; gap: 10px; padding-left: 44px; font-size: 12px; color: var(--text-secondary); }
.patient-meta--muted { color: var(--text-muted); }
.patient-card-m__actions { display: flex; align-items: center; gap: 4px; }
.icon-btn { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
.status-chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.status-chip--active { background: var(--primary-light); color: var(--primary); }
.status-chip--archived { background: var(--slate-100); color: var(--slate-600); }
.status-chip--pending { background: var(--overdue-bg); color: var(--overdue-text); }
.status-text { font-size: 13.5px; font-weight: 600; color: var(--text-secondary); }
.status-text--check { display: inline-flex; align-items: center; gap: 5px; color: var(--primary); }
.status-text--check svg { flex-shrink: 0; }
.chip-row { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</helmet>

<div class="screen">
  <header class="workspace-header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-secondary)"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
    <div class="workspace-header__right">
      <div class="workspace-header__icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6"></path><path d="M10 21a2 2 0 004 0"></path></svg>
        <span class="workspace-header__notif-dot"></span>
      </div>
      <div class="workspace-header__avatar">RD</div>
    </div>
  </header>

  <main class="workspace-main">
    <div class="page-title-row">
      <h1 class="patients-title">Patients</h1>
      <div class="patients-dropdown">Active
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>
    <div class="page-actions-row">
      <button class="header-soft-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
        Add Patient
      </button>
      <button class="header-soft-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"></path></svg>
        Bulk Upload
      </button>
    </div>

    <div class="patient-cards">
      <div class="patient-card-m patient-card-m--intake">
        <div class="patient-card-m__top">
          <div class="patient-identity">
            <div class="patient-avatar patient-avatar--intake">KN</div>
            <div>
              <div class="patient-name">Kabir Nair</div>
              <div class="patient-meta--muted" style="font-size:12px;">29 &middot; Male</div>
            </div>
          </div>
          <span class="status-chip status-chip--pending">New Intake</span>
        </div>
      </div>

      <div class="patient-card-m">
        <div class="patient-card-m__top">
          <div class="patient-identity">
            <div class="patient-avatar">PS</div>
            <span class="patient-name">Priya Sharma</span>
          </div>
          <div class="patient-card-m__actions">
            <div class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
            <div class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></div>
            <div class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8"></path><path d="M10 13h4"></path></svg></div>
          </div>
        </div>
        <div class="patient-meta-row"><span>34 yrs</span><span>Female</span><span class="patient-meta--muted">Aug 2</span></div>
        <div class="chip-row">
          <span class="status-text">Active</span>
          <span class="status-text status-text--check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"></path></svg>Completed</span>
        </div>
      </div>

      <div class="patient-card-m">
        <div class="patient-card-m__top">
          <div class="patient-identity">
            <div class="patient-avatar patient-avatar--terracotta">AM</div>
            <span class="patient-name">Arjun Mehta</span>
          </div>
          <div class="patient-card-m__actions">
            <div class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
            <div class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></div>
            <div class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8"></path><path d="M10 13h4"></path></svg></div>
          </div>
        </div>
        <div class="patient-meta-row"><span>41 yrs</span><span>Male</span><span class="patient-meta--muted">Jul 19</span></div>
        <div class="chip-row">
          <span class="status-text">Active</span>
          <span class="status-chip status-chip--pending">Pending</span>
        </div>
      </div>

      <div class="patient-card-m">
        <div class="patient-card-m__top">
          <div class="patient-identity">
            <div class="patient-avatar patient-avatar--plum">RV</div>
            <span class="patient-name">Rohan Verma</span>
          </div>
          <div class="patient-card-m__actions">
            <div class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
            <div class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg></div>
            <div class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9"></path><path d="M3 3v6h6"></path></svg></div>
          </div>
        </div>
        <div class="patient-meta-row"><span>52 yrs</span><span>Male</span><span class="patient-meta--muted">May 4</span></div>
        <div class="chip-row">
          <span class="status-chip status-chip--archived">Archived</span>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
